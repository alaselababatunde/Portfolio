version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - TESCO_AI_SUPPORT_OPENROUTER_MODEL_KEY=${TESCO_AI_SUPPORT_OPENROUTER_MODEL_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_db
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3000:5173" # Vite default port mapped to 3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  chroma_data:
